return world;
}
const sigOf=stories=>JSON.stringify(stories.map(story=>[story.id,story.status,story.waitingOn===undefined?null:String(story.waitingOn)]).sort());
function itemOf(li,snapshotAt){
const created=Number(li.dataset.created)||0,q=li.querySelector('.ny-q');
return {messageId:Number(li.dataset.id),askId:li.dataset.ask?Number(li.dataset.ask):null,story:li.dataset.story,path:li.dataset.path||null,kind:li.dataset.kind,createdAtMs:created,ageMs:Math.max(0,snapshotAt-created),
question:q.getAttribute('title')||[...q.childNodes].filter(node=>node.nodeType===3).map(node=>node.textContent).join('')};
}
function mount(root,cs){
const snapshotAt=Number(root.dataset.asof)||null;
const state={open:[],older:[],partial:false,mode:'snapshot',at:snapshotAt||Date.now(),snapshotAt,olderOpen:false,live:false,feedLost:false,sig:null};
if(snapshotAt){
const rows=list=>[...list.querySelectorAll(':scope > li.ny-row')].map(li=>itemOf(li,snapshotAt));
const top=root.querySelector(':scope > ul.ny-list'),older=root.querySelector(':scope > details.ny-older > ul.ny-list');
state.open=top?rows(top):[];state.older=older?rows(older):[];
}
const note=document.createElement('p');note.className='ny-note';note.setAttribute('role','status');
root.append(note);
root.tabIndex=-1;
function paint(){
const active=root.contains(document.activeElement)?document.activeElement.getAttribute('data-focus'):null;
const details=root.querySelector(':scope > details.ny-older');if(details)state.olderOpen=details.open;
root.replaceChildren(...viewTree(state).map(toDom),note);
if(active){const next=root.querySelector(`[data-focus="${CSS.escape(active)}"]`);(next||root).focus();}
}
const say=text=>{note.textContent=text;};
const failed=()=>{state.mode=state.live?'stale-later':'stale-first';state.at=state.live?state.at:(snapshotAt||Date.now());paint();};
let running=false,dirty=false;
async function once(){
try{
const world=await readWorld(cs),result=openCards(world,TEAM);
Object.assign(state,{open:result.open,older:result.older,partial:result.unread.length>0,mode:state.feedLost?'stale-later':'live',at:world.now,live:true,sig:sigOf(world.stories)});
paint();
}catch(error){failed();}
}
async function refresh(){
if(running){dirty=true;return;}
running=true;
try{do{dirty=false;await once();}while(dirty);}finally{running=false;}
}
const act=(verb,args)=>typeof cs.act==='function'?cs.act(verb,args):cs.invoke(verb,args);
root.addEventListener('click',event=>{
const button=event.target.closest&&event.target.closest('[data-act]');
if(!button||!root.contains(button))return;
const verb=button.dataset.act,row=button.closest('li');
say('');
if(verb==='retry'){if(state.feedLost)follow();refresh();return;}
if(!row)return;
const path=row.dataset.path,openStory=fallback=>path?Promise.resolve().then(()=>cs.openFile({path,newTab:true})).then(()=>{if(fallback)say(COPY.openedStory);}):Promise.reject(new Error('no path'));
if(verb==='story')openStory(false).catch(()=>say(COPY.openFailed));
else if(verb==='open')(row.dataset.ask?Promise.resolve().then(()=>act('openMessage',{messageId:Number(row.dataset.ask)})):Promise.reject(new Error('no ask'))).catch(()=>openStory(true)).catch(()=>say(COPY.openFailed));
});
let stops=[];
const gone=()=>{state.feedLost=true;failed();};
function follow(){
for(const stop of stops)try{if(typeof stop==='function')stop();}catch(error){}
stops=[];state.feedLost=false;
try{stops.push(cs.onInboxChanged(()=>{refresh();}));}catch(error){gone();}
try{
stops.push(cs.subscribeContext(STORY_QUERY,(result,error)=>{
if(error){gone();return;}
if(state.sig!==null&&sigOf(storiesOf(result))===state.sig)return;
refresh();
}));
}catch(error){gone();}
}
follow();
refresh();
return {refresh};
}
function boot(){
const cs=typeof window!=='undefined'?window.codesense:null,root=typeof document!=='undefined'?document.getElementById('ny'):null;
if(cs&&root)mount(root,cs);
}
boot();
})();
</script>
