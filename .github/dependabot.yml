# SPDX-License-Identifier: MIT
# Keeps the GitHub Actions, Cargo and npm dependencies up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    # Cargo.lock is at the workspace root, including src-tauri's dependencies.
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # tauri build refuses a crate and its npm package on different minors, and Dependabot bumps
    # each side alone, so minor updates of the pairs are made by hand on both sides together.
    # scripts/tauri-versions.node-test.mjs checks the pairs.
    ignore:
      - dependency-name: "tauri"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "tauri-plugin-*"
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: npm
    # Dependabot uses the existing pnpm-lock.yaml.
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # The npm sides of the Tauri pairs above.
    ignore:
      - dependency-name: "@tauri-apps/api"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@tauri-apps/plugin-*"
        update-types: ["version-update:semver-minor"]
