# SPDX-License-Identifier: MIT
name: Tile release gate

# Dispatched for a release candidate: the @p1 tile specs run on both engines, and the release
# needs 95% of them to pass (tests/e2e-mock/README.md). No test at all fails the gate.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Tile release gate (@p1)
    # Playwright's browsers support Ubuntu 24.04, not the newer image ubuntu-latest names.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: ${{ github.event_name != 'merge_group' && 'pnpm' || '' }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and WebKit
        run: pnpm exec playwright install --with-deps chromium webkit
      # A failed spec doesn't stop the job here: the gate below counts it against the bar.
      - name: Run the @p1 tile specs
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: tiles-p1-report.json
        run: >-
          pnpm exec playwright test -c playwright.mock.config.ts
          --project=tiles-webkit --project=tiles-chromium --grep @p1 --pass-with-no-tests
          --reporter=list,json
      - name: Check the release bar
        run: node scripts/tiles-release-gate.mjs tiles-p1-report.json
      - name: Upload the report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tiles-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tiles-p1-report.json
            test-results
          retention-days: 30
          if-no-files-found: ignore
