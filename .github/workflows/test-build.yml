# SPDX-License-Identifier: MIT
name: Test build

# Run by hand from the Actions tab (or `gh workflow run test-build.yml --ref main`) to get an
# unsigned app to install for testing: pick a platform, or leave it on all. The builds use no
# secrets: they are not notarized and have no updater artifacts (macOS is signed ad hoc).
# README.md#test-builds says how to install each one.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which app to build
        type: choice
        options:
          - all
          - macos
          - windows
          - linux
        default: all

permissions: {}

concurrency:
  # One group per platform, so dispatching two platforms from one ref does not cancel the first.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true

jobs:
  macos-app:
    name: Unsigned macOS app
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-15
    # A cold release build of the app and both sidecars, with no dependency cache.
    timeout-minutes: 150
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The build's docs check compares the export files with origin/main, which a
          # shallow checkout of a branch lacks.
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up Rust
        # Matches ci.yml; rustup's proxies read the channel in rust-toolchain.toml.
        run: rustup toolchain install stable --profile minimal
      - name: Build app
        # Sidecars, git-ai, the ad-hoc signed bundle and its zip: see the script.
        run: bash scripts/ci/unsigned-bundle.sh macos
      - name: Write manifest
        run: bash scripts/ci/bundle-manifest.sh target/release/bundle/macos/CodeSense.app > "$RUNNER_TEMP/bundle-manifest.txt"
      - name: Upload app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/CodeSense.app.zip
          # One file, uploaded as is and named after it, so testers don't get a zip inside a zip.
          archive: false
          retention-days: 7
          if-no-files-found: error
      - name: Upload DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: target/release/bundle/dmg/*.dmg
          archive: false
          retention-days: 7
          if-no-files-found: error
      - name: Upload manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/bundle-manifest.txt
          archive: false
          retention-days: 7
          if-no-files-found: error

  linux-app:
    name: Unsigned Linux app (${{ matrix.arch }})
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    # One definition for both architectures; each leg builds natively. x86_64 runs on the
    # oldest hosted Ubuntu so the bundle links an older glibc; the arm64 leg runs on
    # 24.04, so that build needs Ubuntu 24.04 or newer.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            bundles: deb,rpm,appimage
          # Both legs bundle the AppImage without the emulator and insert it untouched afterwards
          # (scripts/ci/unsigned-bundle.sh): linuxdeploy's rpath rewrite breaks the Bun-compiled
          # emulator, and on aarch64 aborts the bundle.
          - arch: arm64
            runner: ubuntu-24.04-arm
            bundles: deb,rpm
    runs-on: ${{ matrix.runner }}
    # A cold release build of the app and both sidecars, with no dependency cache.
    timeout-minutes: 150
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The build's docs check compares the export files with origin/main, which a
          # shallow checkout of a branch lacks.
          fetch-depth: 0
      - name: Install system libraries
        # What rust.yml's Linux check installs, plus file (linuxdeploy), rpm (the rpm bundle) and
        # squashfs-tools (the AppImage rebuild in unsigned-bundle.sh).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libxdo-dev libssl-dev \
            file rpm squashfs-tools
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up Rust
        # Matches ci.yml; rustup's proxies read the channel in rust-toolchain.toml.
        run: rustup toolchain install stable --profile minimal
      - name: Check scripts
        # Both scripts, here: macOS runners ship no shellcheck.
        run: shellcheck scripts/ci/unsigned-bundle.sh scripts/ci/bundle-manifest.sh
      - name: Build app
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: bash scripts/ci/unsigned-bundle.sh linux "$BUNDLES"
      - name: Check the sidecars sit beside the app
        # The app binary's name comes from the product, so it is the one other file in /usr/bin.
        run: |
          listing=$(dpkg -c target/release/bundle/deb/*.deb)
          echo "$listing"
          bin_files=$(awk '$NF ~ /(^|\/)usr\/bin\/[^/]+$/ {print $NF}' <<<"$listing")
          for name in codesense-bridge codesense-session-server codesense-emulator; do
            grep -E "(^|/)usr/bin/$name\$" <<<"$bin_files" || { echo "Error: $name is not in /usr/bin of the deb" >&2; exit 1; }
          done
          [[ $(wc -l <<<"$bin_files") -eq 4 ]] || { echo "Error: expected the app binary and three sidecars in /usr/bin" >&2; exit 1; }
      - name: Check the AppImage emulator
        # A Bun-compiled executable keeps its payload after the ELF image, so the emulator must
        # reach the AppImage's usr/bin byte for byte. The step prints every result before it
        # fails on any, and extracts without FUSE in a temp dir of its own.
        if: contains(matrix.bundles, 'appimage')
        run: |
          built="$PWD/src-tauri/binaries/codesense-emulator-$(rustc -vV | sed -n 's/^host: //p')"
          appimage=$(ls "$PWD"/target/release/bundle/appimage/*.AppImage)
          # The sidecar names come from the Linux config the bundle is built from.
          sidecars=$(node -p 'require("./src-tauri/tauri.linux.conf.json").bundle.externalBin.map((p) => p.split("/").pop()).join("\n")')
          cd "$(mktemp -d)"
          "$appimage" --appimage-extract >/dev/null
          bin_files=$(find squashfs-root/usr/bin -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          echo "usr/bin: ${bin_files//$'\n'/ }"
          files_ok=true
          for name in $sidecars; do
            grep -qx "$name" <<<"$bin_files" || { echo "Error: $name is not in usr/bin of the AppImage" >&2; files_ok=false; }
          done
          [[ $(wc -l <<<"$bin_files") -eq $(($(wc -l <<<"$sidecars") + 1)) ]] || { echo "Error: expected the app binary and the sidecars in usr/bin" >&2; files_ok=false; }
          emulator=squashfs-root/usr/bin/codesense-emulator
          same=false
          [[ -f "$emulator" && $(sha256sum <"$emulator") == $(sha256sum <"$built") ]] && same=true
          rc=0
          timeout 10 "./$emulator" </dev/null >stdout.txt || rc=$?
          stdout_bytes=$(wc -c <stdout.txt)
          echo "files: $files_ok"
          echo "sha256 matches the built emulator: $same ($(sha256sum <"$emulator" | cut -c1-64) vs $(sha256sum <"$built" | cut -c1-64))"
          echo "exit code with no input: $rc"
          echo "stdout bytes with no input: $stdout_bytes"
          head -c 400 stdout.txt
          [[ $files_ok == true && $same == true && $rc -eq 0 && $stdout_bytes -eq 0 ]]
      - name: Upload deb
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: target/release/bundle/deb/*.deb
          archive: false
          retention-days: 7
          if-no-files-found: error
      - name: Upload rpm
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: target/release/bundle/rpm/*.rpm
          archive: false
          retention-days: 7
          if-no-files-found: error
      - name: Upload AppImage
        if: contains(matrix.bundles, 'appimage')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: target/release/bundle/appimage/*.AppImage
          archive: false
          retention-days: 7
          if-no-files-found: error
