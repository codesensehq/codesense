# SPDX-License-Identifier: MIT
name: Test build

# Run by hand from the Actions tab (or `gh workflow run test-build.yml --ref main`) to get an
# unsigned app to install for testing: pick a platform, or leave it on all. The builds use no
# secrets: they are not notarized and have no updater artifacts (macOS is signed ad hoc).
# README.md#test-builds says how to install each one.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which app to build
        type: choice
        options:
          - all
          - macos
          - windows
          - linux
        default: all

permissions: {}

concurrency:
  # One group per platform, so dispatching two platforms from one ref does not cancel the first.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true

jobs:
  macos-app:
    name: Unsigned macOS app
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-15
    # A cold release build of the app and both sidecars, with no dependency cache.
    timeout-minutes: 150
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The build's docs check compares the export files with origin/main, which a
          # shallow checkout of a branch lacks.
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up Rust
        # Matches ci.yml; rustup's proxies read the channel in rust-toolchain.toml.
        run: rustup toolchain install stable --profile minimal
      - name: Build app
        # Sidecars, git-ai, the ad-hoc signed bundle and its zip: see the script.
        run: bash scripts/ci/unsigned-bundle.sh macos
      - name: Write manifest
        run: bash scripts/ci/bundle-manifest.sh target/release/bundle/macos/CodeSense.app > "$RUNNER_TEMP/bundle-manifest.txt"
      - name: Upload app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/CodeSense.app.zip
          # One file, uploaded as is and named after it, so testers don't get a zip inside a zip.
          archive: false
          retention-days: 7
          if-no-files-found: error
      - name: Upload DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: target/release/bundle/dmg/*.dmg
          archive: false
          retention-days: 7
          if-no-files-found: error
      - name: Upload manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/bundle-manifest.txt
          archive: false
          retention-days: 7
          if-no-files-found: error

  linux-app:
    name: Unsigned Linux app (${{ matrix.arch }})
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    # One definition for both architectures; each leg builds natively. x86_64 runs on the
    # oldest hosted Ubuntu so the bundle links an older glibc; the arm64 leg runs on
    # 24.04, so that build needs Ubuntu 24.04 or newer.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            bundles: deb,rpm,appimage
          # No AppImage on arm64: linuxdeploy rewrites the bundled emulator executable, which
          # breaks it on aarch64.
          - arch: arm64
            runner: ubuntu-24.04-arm
            bundles: deb,rpm
    runs-on: ${{ matrix.runner }}
    # A cold release build of the app and both sidecars, with no dependency cache.
    timeout-minutes: 150
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The build's docs check compares the export files with origin/main, which a
          # shallow checkout of a branch lacks.
          fetch-depth: 0
      - name: Install system libraries
        # What rust.yml's Linux check installs, plus file (linuxdeploy) and rpm (the rpm bundle).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libxdo-dev libssl-dev \
            file rpm
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up Rust
        # Matches ci.yml; rustup's proxies read the channel in rust-toolchain.toml.
        run: rustup toolchain install stable --profile minimal
      - name: Check scripts
        # All of them, here: macOS runners ship no shellcheck.
        run: shellcheck scripts/ci/unsigned-bundle.sh scripts/ci/bundle-manifest.sh scripts/ci/smoke-linux.sh
      - name: Build app
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: bash scripts/ci/unsigned-bundle.sh linux "$BUNDLES"
      - name: Check the sidecars sit beside the app
        # The app binary's name comes from the product, so it is the one other file in /usr/bin.
        run: |
          listing=$(dpkg -c target/release/bundle/deb/*.deb)
          echo "$listing"
          bin_files=$(awk '$NF ~ /(^|\/)usr\/bin\/[^/]+$/ {print $NF}' <<<"$listing")
          for name in codesense-bridge codesense-session-server codesense-emulator; do
            grep -E "(^|/)usr/bin/$name\$" <<<"$bin_files" || { echo "Error: $name is not in /usr/bin of the deb" >&2; exit 1; }
          done
          [[ $(wc -l <<<"$bin_files") -eq 4 ]] || { echo "Error: expected the app binary and three sidecars in /usr/bin" >&2; exit 1; }
      - name: Upload deb
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: target/release/bundle/deb/*.deb
          archive: false
          retention-days: 7
          if-no-files-found: error
      - name: Upload rpm
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: target/release/bundle/rpm/*.rpm
          archive: false
          retention-days: 7
          if-no-files-found: error
      - name: Upload AppImage
        if: contains(matrix.bundles, 'appimage')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: target/release/bundle/appimage/*.AppImage
          archive: false
          retention-days: 7
          if-no-files-found: error

  linux-smoke:
    name: Linux packaging smoke (${{ matrix.arch }})
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    # A matrix job is needed whole, so both legs wait for both builds.
    needs: linux-app
    # Each leg runs on its build's runner and picks that build's packages by the architecture
    # in their names. scripts/ci/smoke-linux.sh says what each step checks.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            artifacts: "*{_amd64.deb,.x86_64.rpm,_amd64.AppImage}"
            deb_images: ubuntu:22.04 ubuntu:24.04
            appimage: true
          # The arm64 build runs on 24.04, so 24.04 is the oldest Ubuntu it installs on.
          - arch: arm64
            runner: ubuntu-24.04-arm
            artifacts: "*{_arm64.deb,.aarch64.rpm}"
            deb_images: ubuntu:24.04
            appimage: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download packages
        # v8 is the first to read the unzipped files linux-app uploads.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ matrix.artifacts }}
          path: ${{ runner.temp }}/packages
          merge-multiple: true
      - name: Install the deb and rpm in clean containers
        env:
          DEB_IMAGES: ${{ matrix.deb_images }}
        run: |
          for image in $DEB_IMAGES; do
            bash scripts/ci/smoke-linux.sh install deb "$image" "$RUNNER_TEMP/packages" "$RUNNER_TEMP/smoke"
          done
          bash scripts/ci/smoke-linux.sh install rpm fedora:44 "$RUNNER_TEMP/packages" "$RUNNER_TEMP/smoke"
          bash scripts/ci/smoke-linux.sh same-resources "$RUNNER_TEMP/smoke/deb.list" "$RUNNER_TEMP/smoke/rpm.list"
      - name: Install the desktop session tools
        # An AppImage leaves out the GL, EGL and Mesa libraries every desktop has.
        if: matrix.appimage
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth dbus gnome-keyring imagemagick \
            libegl1 libgl1 libgles2 libgl1-mesa-dri
      - name: Launch the AppImage
        if: matrix.appimage
        run: bash scripts/ci/smoke-linux.sh run "$RUNNER_TEMP/packages" "$RUNNER_TEMP/smoke/appimage"
      - name: Launch the AppImage with DMABUF kept
        if: matrix.appimage
        run: bash scripts/ci/smoke-linux.sh variant dmabuf "$RUNNER_TEMP/smoke/appimage"
      - name: Launch the AppImage with no session bus
        if: matrix.appimage
        run: bash scripts/ci/smoke-linux.sh variant no-dbus "$RUNNER_TEMP/smoke/appimage"
      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-smoke-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/smoke/*.list
            ${{ runner.temp }}/smoke/appimage/listing
            ${{ runner.temp }}/smoke/appimage/*.log
            ${{ runner.temp }}/smoke/appimage/*.png
          retention-days: 7
          if-no-files-found: warn
