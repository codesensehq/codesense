# SPDX-License-Identifier: MIT
name: Rust tests

on:
  pull_request:
    # The defaults, plus labeled: adding ci:macos or ci:windows starts that OS's job (below) on the pull request.
    types: [opened, synchronize, reopened, labeled]
  merge_group:
  # The macOS and Windows jobs skip merge groups, so they run on each push to main instead, after the merge.
  # The nightly run on main saves the caches and tracks flaky tests.
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  # A label other than ci:macos gets a group of its own, so it never cancels the pull request's run.
  # ci:windows is such a label: its run must not cancel a ci:macos run either.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}${{ github.event.action == 'labeled' && github.event.label.name != 'ci:macos' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  # No debuginfo (the test profile inherits dev): compiles and links faster. Panic messages
  # keep file:line, which comes from the panic location; only backtrace frames lose line numbers.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  changes:
    name: Rust changes
    # A merge group or pull request that changes nothing the Rust jobs build, run or read skips
    # them. GitHub reports a job skipped by its if as a success, so the required checks still
    # pass (a workflow skipped by a paths filter would leave them pending). The Rust jobs run
    # unless this job says rust=false, so its failure runs them too. A push to main diffs what it
    # added (a new branch tip has no before, so it tests); scheduled and manual runs always test.
    # It also says macos=false when every Rust-relevant change is a file only Windows or Linux
    # compiles (rust-changes.mjs lists them), and the macOS jobs then skip; every way out of the
    # filter step that doesn't diff says macos=true.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      macos: ${{ steps.filter.outputs.macos }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history without file contents: enough to diff a pull request or merge group.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Find Rust-relevant changes
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            merge_group) range="$GROUP_BASE..$GROUP_HEAD" ;;
            push)
              if [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then printf 'rust=true\nmacos=true\n' >> "$GITHUB_OUTPUT"; exit 0; fi
              range="$PUSH_BEFORE..$PUSH_AFTER" ;;
            *) printf 'rust=true\nmacos=true\n' >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          # The filter never judges a change to itself.
          if git diff --name-only "$range" | grep -qE '^(scripts/rust-changes[^/]*|\.github/workflows/rust\.yml)$'; then
            printf 'rust=true\nmacos=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/rust-changes.mjs "$range" >> "$GITHUB_OUTPUT"

  rust-guards:
    name: Rust guards
    # The source guards also scan the frontend (src/), so they run on every change, path filter or
    # not. They need no Tauri build: a small crate whose tests read source files.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        # Matches ci.yml; rustup's proxies read the channel in rust-toolchain.toml.
        run: rustup toolchain install stable --profile minimal
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-guards
          save-if: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Test source guards
        run: cargo test --locked -p codesense-guards

  rust-macos-build:
    name: Rust (macOS arm64) build ${{ matrix.part }}
    # macOS runners are scarce, and the macOS jobs are not a required check: they never run on a
    # merge group, so the queue merges on the Linux and TypeScript checks. They run after the
    # merge, on each push to main that changes something the macOS build can see (the changes
    # job's rust and macos outputs), and always on the nightly schedule and workflow_dispatch; a
    # red run there goes to the next hardening pass. On a pull request they run only with the
    # ci:macos label, never on a Dependabot pull request, and not again when another label is
    # added. workflow-policy allows only this job and rust-macos to skip merge groups or changes
    # only Windows or Linux compiles, and keeps the github.event_name != 'pull_request' || so push
    # and schedule run them.
    # A push to main waits longest for a macOS runner, and by the time it has one, a newer push
    # often exists. Each part then checks main's head first: when main has moved on, the part
    # skips the rest of its steps and gives the runner back, the test shards skip, and rust-macos
    # reports the run as superseded (the newer push's run builds its commit, and the nightly
    # builds every commit). Pull requests, the nightly and dispatched runs never skip this way.
    # This job compiles the tests once into two nextest archives, on two runners at once: every
    # crate's lib unit tests (the app's is most of the compile) and everything else (bins,
    # examples, integration tests, doctests). rust-macos-test runs both in shards.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' && needs.changes.outputs.macos != 'false' && github.event_name != 'merge_group' && (github.event_name != 'pull_request' || (github.event.pull_request.user.login != 'dependabot[bot]' && contains(github.event.pull_request.labels.*.name, 'ci:macos') && (github.event.action != 'labeled' || github.event.label.name == 'ci:macos'))) }}
    runs-on: macos-15
    # Room for a full compile of each half, which a cold workspace cache does not cover.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        part: [lib, rest]
    permissions:
      contents: read
    outputs:
      # Set only to true, by either part; matrix legs that leave an output unset don't clear it.
      superseded: ${{ steps.superseded.outputs.superseded }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      CARGO_TERM_COLOR: always
      RUST_PACKAGES: -p codesense-guards -p codesense -p codesense-platform -p codesense-host-proto -p codesense-pty-core -p codesense-fs-core -p codesense-session-server
      PART: ${{ matrix.part }}
    steps:
      # All paths below are relative to this repository's checkout.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check main's head
        id: superseded
        # A push whose commit is no longer main's head skips its build. A failed lookup builds,
        # and so does a re-run, which someone asked for after main moved on.
        if: github.event_name == 'push' && github.run_attempt == 1
        env:
          SHA: ${{ github.sha }}
        run: |
          if head=$(git ls-remote origin refs/heads/main) && head=${head%%[[:space:]]*} && [[ -n "$head" && "$head" != "$SHA" ]]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "::notice::main is now at $head, so this build skips; the nightly covers $SHA."
          fi
      - name: Configure Git identity
        if: steps.superseded.outputs.superseded != 'true'
        run: |
          git config --global user.name "CodeSense CI"
          git config --global user.email "security@codesense.ai"
      - name: Test sidecar naming with bash 3.2
        # macOS's own /bin/bash, the oldest bash the build scripts run under; once per run.
        if: matrix.part == 'rest' && steps.superseded.outputs.superseded != 'true'
        run: /bin/bash scripts/lib/sidecar.test.sh
      - name: Prepare logs
        if: steps.superseded.outputs.superseded != 'true'
        run: mkdir -p "$RUNNER_TEMP/rust-ci-logs"
      - name: Set up pnpm
        if: steps.superseded.outputs.superseded != 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node
        if: steps.superseded.outputs.superseded != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: ${{ github.event_name != 'merge_group' && 'pnpm' || '' }}
      - name: Install dependencies
        if: steps.superseded.outputs.superseded != 'true'
        run: pnpm install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/rust-ci-logs/pnpm-install.log"
      - name: Set up Rust
        # Matches ci.yml; rustup's proxies read the channel in rust-toolchain.toml.
        if: steps.superseded.outputs.superseded != 'true'
        run: rustup toolchain install stable --profile minimal 2>&1 | tee "$RUNNER_TEMP/rust-ci-logs/rustup.log"
      - name: Restore scanner archives
        # Archives named by their sha256; install-scanners verifies each against the lock before use.
        id: scanner-cache
        if: steps.superseded.outputs.superseded != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scanner-archives
          key: scanner-archives-nextest-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('release/scanners.lock') }}
      - name: Install pinned nextest
        if: steps.superseded.outputs.superseded != 'true'
        run: |
          bash scripts/install-scanners.sh "$RUNNER_TEMP/rust-ci-tools" --cache "$RUNNER_TEMP/scanner-archives" --tool cargo-nextest
          echo "$RUNNER_TEMP/rust-ci-tools" >> "$GITHUB_PATH"
      - name: Save scanner archives
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && steps.scanner-cache.outputs.cache-hit != 'true' && steps.superseded.outputs.superseded != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scanner-archives
          key: ${{ steps.scanner-cache.outputs.cache-primary-key }}
      - name: Key the workspace build cache
        id: build-cache-key
        # The dependency cache below leaves out the workspace crates, most of the compile. The
        # nightly saves this part's whole target/ under a key of its own (rust-macos-cache-prune
        # then deletes the older ones); other runs restore the newest for this toolchain, for
        # this Cargo.lock when there is one.
        if: steps.superseded.outputs.superseded != 'true'
        env:
          MANIFESTS: ${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src-tauri/Cargo.toml', 'src-tauri/crates/*/Cargo.toml') }}
        run: |
          toolchain="rust-macos-build-$PART-$RUNNER_OS-$RUNNER_ARCH-$(rustc -vV | shasum -a 256 | cut -c1-16)"
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
          echo "manifests=$toolchain-$MANIFESTS" >> "$GITHUB_OUTPUT"
      - name: Restore the workspace build
        id: build-cache
        # Not on the nightly, which builds cold: a build that kept an older target/ could carry a
        # crate it no longer builds, dated before a change the next run would trust it for.
        if: github.event_name != 'schedule' && steps.superseded.outputs.superseded != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ steps.build-cache-key.outputs.manifests }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.build-cache-key.outputs.manifests }}-
            ${{ steps.build-cache-key.outputs.toolchain }}-
      - name: Cache Rust dependencies
        # Only when no workspace build was restored: that has the dependencies too. The nightly
        # restores none, so it saves this cache as before.
        if: steps.build-cache.outputs.cache-matched-key == '' && steps.superseded.outputs.superseded != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-macos
          save-if: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Date the checkout for the cached build
        # Before the first cargo command, the sidecar build: the files unchanged since the cached
        # build get an old date, so cargo rebuilds only what changed (build-cache-dates.sh).
        if: steps.build-cache.outputs.cache-matched-key != '' && steps.superseded.outputs.superseded != 'true'
        run: bash scripts/build-cache-dates.sh restore
      - name: Fetch git-ai
        if: steps.superseded.outputs.superseded != 'true'
        run: bash scripts/fetch-git-ai.sh 2>&1 | tee "$RUNNER_TEMP/rust-ci-logs/fetch-git-ai.log"
      - name: Build session-server sidecar
        # This also builds the bridge sidecar, so a separate bridge build is unnecessary.
        # Native host only: build-emulator.sh fetches checksum-pinned Bun itself.
        # Docker is only used for uninstalled cross targets, which are not requested.
        if: steps.superseded.outputs.superseded != 'true'
        run: bash scripts/build-session-server.sh 2>&1 | tee "$RUNNER_TEMP/rust-ci-logs/build-session-server.log"
      - name: Generate docs data
        # The app's build script writes these untracked files into directories it watches, so on
        # a fresh checkout the next cargo command reran it and recompiled the app. Written before
        # the first cargo command, they are current when the build script runs.
        if: steps.superseded.outputs.superseded != 'true'
        run: |
          scripts=$(sed -n 's/^ *run_docs_generator("\.\.\/\(scripts\/[^"]*\.mjs\)");$/\1/p' src-tauri/build.rs)
          [[ -n "$scripts" ]] || { echo "::error::no docs generators found in src-tauri/build.rs"; exit 1; }
          for script in $scripts; do node "$script"; done
      - name: Date the unchanged build inputs
        # git-ai, the sidecars and the docs data were just written again: each the cached build
        # read as it is now goes back to the old date, so the app's build script doesn't rerun.
        if: steps.build-cache.outputs.cache-matched-key != '' && steps.superseded.outputs.superseded != 'true'
        run: bash scripts/build-cache-dates.sh pin
      - name: Compile macOS tests
        id: compile
        # The two parts together are what a plain cargo test builds. A named --test is explicit,
        # so cargo would refuse one whose required features are off; those are left out, as
        # cargo test leaves them out.
        if: steps.superseded.outputs.superseded != 'true'
        run: |
          read -r -a packages <<< "$RUST_PACKAGES"
          if [[ "$PART" == lib ]]; then
            targets=(--lib)
          else
            targets=(--bins --examples)
            names=$(cargo metadata --locked --no-deps --format-version 1 | jq -r --arg packages "$RUST_PACKAGES" '
              ($packages | split(" ") | map(select(. != "-p"))) as $selected
              | .packages[] | select(.name as $name | $selected | index($name))
              | .targets[] | select(.kind == ["test"] and ((.["required-features"] // []) | length == 0))
              | .name')
            for name in $names; do targets+=(--test "$name"); done
          fi
          cargo nextest archive "${packages[@]}" "${targets[@]}" \
            --archive-file "$RUNNER_TEMP/nextest-archive-$PART.tar.zst" \
          2>&1 | tee "$RUNNER_TEMP/rust-ci-logs/cargo-compile.log"
      - name: Record the build's commit and inputs
        # Right after the compile: the untracked files the build read, then the commit, so a later
        # run knows what changed since.
        id: record
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && steps.superseded.outputs.superseded != 'true'
        run: bash scripts/build-cache-dates.sh record
      - name: Collect test runtime files
        # The untracked files the tests read beside the archives: sidecars, bundled resources and
        # generated docs data. Both parts make the same ones; the rest part ships them.
        if: matrix.part == 'rest' && steps.superseded.outputs.superseded != 'true'
        run: |
          git ls-files -z --others --ignored --exclude-standard -- src-tauri codesense-docs \
            | tar --null -T - -cf "$RUNNER_TEMP/test-runtime.tar"
      - name: Upload test archive
        if: steps.superseded.outputs.superseded != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # One name per part for the whole run, not per attempt: re-running only the failed
          # shards starts a new attempt and still finds both archives, and a re-run part
          # replaces its own.
          name: rust-macos-tests-${{ matrix.part }}-${{ github.run_id }}
          overwrite: true
          path: |
            ${{ runner.temp }}/nextest-archive-${{ matrix.part }}.tar.zst
            ${{ runner.temp }}/test-runtime.tar
          retention-days: 1
          compression-level: 1
          if-no-files-found: error
      - name: Test macOS doctests
        timeout-minutes: 15
        # In the rest part, which built the libraries the doctests link. Runs after a failed
        # upload, but not when the test build never ran; on macOS the build script then fails on
        # sidecars an earlier failed step never built, hiding the real failure.
        if: (success() || failure()) && steps.compile.outcome == 'success' && matrix.part == 'rest' && steps.superseded.outputs.superseded != 'true'
        run: |
          read -r -a packages <<< "$RUST_PACKAGES"
          cargo test --doc "${packages[@]}" --no-fail-fast \
          2>&1 | tee "$RUNNER_TEMP/rust-ci-logs/cargo-doctest.log"
      - name: Check tracked files are unchanged
        id: tracked
        if: (success() || failure()) && steps.superseded.outputs.superseded != 'true'
        run: git diff --exit-code 2>&1 | tee "$RUNNER_TEMP/rust-ci-logs/tracked-files.log"
      - name: Save the workspace build
        # Whatever the tests did, once the build was recorded and left tracked files as they were.
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && !cancelled() && steps.record.outcome == 'success' && steps.tracked.outcome == 'success' && steps.superseded.outputs.superseded != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ steps.build-cache-key.outputs.manifests }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload failure logs
        if: failure() && steps.superseded.outputs.superseded != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-macos-logs-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-ci-logs/
          retention-days: 7
          if-no-files-found: warn
      - name: Summarize a red run on main
        # Nothing blocks on the macOS jobs, so a red build on main says so in the job summary for
        # the hardening pass, with the run link. Read-only: no issue is written.
        if: (failure() || cancelled()) && github.ref == 'refs/heads/main' && steps.superseded.outputs.superseded != 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/flaky-tests.mjs failed target/nextest/ci/junit.xml --run-url "$RUN_URL"

  rust-macos-cache-prune:
    name: Prune the macOS build caches
    # Each nightly saves a workspace build per part, some GB together, so the older ones are
    # deleted once it has: the newest per part stays. The only job here that writes caches'
    # metadata; the macOS build keeps contents: read. Only the nightly on main in this repository.
    needs: rust-macos-build
    if: ${{ !cancelled() && github.event_name == 'schedule' && github.ref == 'refs/heads/main' && !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Delete all but the newest build cache per part
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$GH_REPO/actions/caches?key=rust-macos-build-&ref=refs/heads/main&per_page=100" \
            --jq '.actions_caches[] | [.id, .key, .created_at] | @tsv' > caches.tsv
          # Newest first; the part is the key's fourth field (rust-macos-build-<part>-...).
          sort -t $'\t' -k3,3r caches.tsv | awk -F '\t' '{ split($2, k, "-"); if (seen[k[4]]++) print $1 }' > stale.txt
          echo "$(wc -l < caches.tsv) build caches; deleting $(wc -l < stale.txt)"
          # An entry GitHub evicted since the listing is already gone (404); any other failure fails.
          while read -r id; do
            if ! gh api -X DELETE "repos/$GH_REPO/actions/caches/$id" 2> error.txt; then
              cat error.txt >&2
              grep -q 'HTTP 404' error.txt || exit 1
              echo "::notice::cache $id already gone"
            fi
          done < stale.txt

  rust-macos-test:
    name: Rust (macOS arm64) tests ${{ matrix.shard }}/3
    # Runs the build job's two archives, a third of each per shard, so no shard compiles. It runs
    # only after both parts of that build succeed, and so never on a merge group, and not when a
    # part found main had moved on (no archives).
    needs: rust-macos-build
    if: needs.rust-macos-build.outputs.superseded != 'true'
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      RUST_BACKTRACE: "1"
      CARGO_TERM_COLOR: always
    steps:
      # The same checkout path as the build job, which the archive's compiled-in paths name.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure Git identity
        run: |
          git config --global user.name "CodeSense CI"
          git config --global user.email "security@codesense.ai"
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: ${{ github.event_name != 'merge_group' && 'pnpm' || '' }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up Rust
        # Matches ci.yml; rustup's proxies read the channel in rust-toolchain.toml.
        run: rustup toolchain install stable --profile minimal
      - name: Restore scanner archives
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scanner-archives
          key: scanner-archives-nextest-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('release/scanners.lock') }}
      - name: Install pinned nextest
        run: |
          bash scripts/install-scanners.sh "$RUNNER_TEMP/rust-ci-tools" --cache "$RUNNER_TEMP/scanner-archives" --tool cargo-nextest
          echo "$RUNNER_TEMP/rust-ci-tools" >> "$GITHUB_PATH"
      - name: Download test archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rust-macos-tests-*-${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/rust-macos-tests
      - name: Restore test runtime files
        run: tar -xf "$RUNNER_TEMP/rust-macos-tests/test-runtime.tar"
      - name: Build the emulator worker
        # session-server's activity tests rebuild the worker in each test process. The pinned Bun
        # they compile with is not in the archive, so on a fresh runner several processes fetched
        # it at once, each replacing the binary another was running (macOS kills that process).
        # One build first leaves Bun in place, and theirs only recompile.
        run: pnpm run build:emulator
      - name: Test macOS crates
        id: test
        # Each archive is extracted into the checkout, so the target directory is where the build
        # job's was. Both run, and each one's JUnit report is kept before the next overwrites it.
        # Exercises macOS cfg tests in the host crates as well as the desktop app.
        run: |
          mkdir -p "$RUNNER_TEMP/junit"
          status=0
          for part in lib rest; do
            cargo nextest run --profile ci --archive-file "$RUNNER_TEMP/rust-macos-tests/nextest-archive-$part.tar.zst" \
              --workspace-remap "$GITHUB_WORKSPACE" --extract-to "$GITHUB_WORKSPACE" --extract-overwrite \
              --partition "slice:${{ matrix.shard }}/3" || status=1
            if [[ -f target/nextest/ci/junit.xml ]]; then mv target/nextest/ci/junit.xml "$RUNNER_TEMP/junit/$part.xml"; fi
          done
          exit "$status"
      - name: List flaky tests
        # A pass on nextest's one retry is flaky: listed in the job summary and the JUnit report,
        # and tracked as a public issue by flaky-issues on main.
        if: success() || failure()
        run: for report in "$RUNNER_TEMP"/junit/*.xml; do node scripts/flaky-tests.mjs summary "$report"; done
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # flaky-issues reads rust-*-junit-<run>-<attempt>; flaky-tests drops the shard.
          name: rust-macos-shard-${{ matrix.shard }}-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/junit/
          retention-days: 7
          if-no-files-found: warn
      - name: Check tracked files are unchanged
        if: success() || failure()
        run: git diff --exit-code
      - name: Summarize a red run on main
        # Each failed test of this shard in the job summary, with the run link, for the hardening
        # pass. Read-only: no issue is written. Last, so a timeout (cancelled) still gets one.
        if: (failure() || cancelled()) && github.ref == 'refs/heads/main'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for part in lib rest; do
            node scripts/flaky-tests.mjs failed "$RUNNER_TEMP/junit/$part.xml" --run-url "$RUN_URL"
          done

  rust-macos:
    name: Rust (macOS arm64)
    # The one macOS result: green only when the build and every test shard are, or when the build
    # was superseded by a newer push to main. It runs when the build job does (the same if), so a
    # skipped build reports a skip here, and also when the run is cancelled (always() in place of
    # !cancelled()), so a cancelled run reports red, not skipped.
    needs: [changes, rust-macos-build, rust-macos-test]
    if: ${{ always() && needs.changes.outputs.rust != 'false' && needs.changes.outputs.macos != 'false' && github.event_name != 'merge_group' && (github.event_name != 'pull_request' || (github.event.pull_request.user.login != 'dependabot[bot]' && contains(github.event.pull_request.labels.*.name, 'ci:macos') && (github.event.action != 'labeled' || github.event.label.name == 'ci:macos'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check the macOS build and tests
        env:
          BUILD: ${{ needs.rust-macos-build.result }}
          TESTS: ${{ needs.rust-macos-test.result }}
          SUPERSEDED: ${{ needs.rust-macos-build.outputs.superseded }}
        run: |
          echo "build: $BUILD, tests: $TESTS, superseded: ${SUPERSEDED:-false}"
          if [[ "$BUILD" == success && "$SUPERSEDED" == true ]]; then
            echo "Superseded by a newer push to main; the nightly covers this commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ "$BUILD" == success && "$TESTS" == success ]]

  rust-linux:
    name: Rust (Linux)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      CARGO_TERM_COLOR: always
      # Only the crates that pass on Linux today, and the bridge; macOS also runs pty-core,
      # session-server, guards and the desktop app.
      RUST_PACKAGES: -p codesense-platform -p codesense-host-proto -p codesense-fs-core -p codesense-bridge
    steps:
      # All paths below are relative to this repository's checkout.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure Git identity
        run: |
          git config --global user.name "CodeSense CI"
          git config --global user.email "security@codesense.ai"
      - name: Prepare logs
        run: mkdir -p "$RUNNER_TEMP/rust-ci-logs"
      - name: Set up Rust
        # Matches ci.yml; rustup's proxies read the channel in rust-toolchain.toml.
        run: rustup toolchain install stable --profile minimal 2>&1 | tee "$RUNNER_TEMP/rust-ci-logs/rustup.log"
      - name: Restore scanner archives
        # Archives named by their sha256; install-scanners verifies each against the lock before use.
        id: scanner-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scanner-archives
          key: scanner-archives-nextest-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('release/scanners.lock') }}
      - name: Install pinned nextest
        run: |
          bash scripts/install-scanners.sh "$RUNNER_TEMP/rust-ci-tools" --cache "$RUNNER_TEMP/scanner-archives" --tool cargo-nextest
          echo "$RUNNER_TEMP/rust-ci-tools" >> "$GITHUB_PATH"
      - name: Save scanner archives
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && steps.scanner-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scanner-archives
          key: ${{ steps.scanner-cache.outputs.cache-primary-key }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-linux
          save-if: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Compile Linux tests
        id: compile
        run: |
          read -r -a packages <<< "$RUST_PACKAGES"
          cargo nextest run --profile ci "${packages[@]}" --no-run \
          2>&1 | tee "$RUNNER_TEMP/rust-ci-logs/cargo-compile.log"
      - name: Test Linux crates
        run: |
          read -r -a packages <<< "$RUST_PACKAGES"
          cargo nextest run --profile ci "${packages[@]}" \
          2>&1 | tee "$RUNNER_TEMP/rust-ci-logs/cargo-test.log"
      - name: List flaky tests
        # A pass on nextest's one retry is flaky: listed in the job summary and the JUnit report,
        # and tracked as a public issue by flaky-issues on main.
        if: (success() || failure()) && steps.compile.outcome == 'success'
        run: node scripts/flaky-tests.mjs summary target/nextest/ci/junit.xml
      - name: Test Linux doctests
        timeout-minutes: 15
        # Runs after failed tests, but not when the test build never ran, so an earlier failure
        # is reported as itself.
        if: (success() || failure()) && steps.compile.outcome == 'success'
        run: |
          read -r -a packages <<< "$RUST_PACKAGES"
          cargo test --doc "${packages[@]}" --no-fail-fast \
          2>&1 | tee "$RUNNER_TEMP/rust-ci-logs/cargo-doctest.log"
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-linux-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: warn
      - name: Check tracked files are unchanged
        if: success() || failure()
        run: git diff --exit-code 2>&1 | tee "$RUNNER_TEMP/rust-ci-logs/tracked-files.log"
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-linux-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-ci-logs/
          retention-days: 7
          if-no-files-found: warn

  rust-check-linux:
    name: Rust check (Linux)
    # A compile check of the desktop app and its tests on pull requests, merge groups, main and the
    # nightly run: the only compile of the app before a merge. Check only: the tests themselves run
    # on macOS, after the merge. It also builds the release-only `dashboard-publish` feature, which
    # no other public job compiles.
    # Gap: code behind `cfg(target_os = "macos")` and the macOS-only dependencies is not compiled
    # on Linux. A change to that code first compiles on main, after the merge; add the `ci:macos`
    # label to the pull request to run the macOS job before the queue.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system libraries
        run: bash scripts/install-linux-app-libs.sh
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: ${{ github.event_name != 'merge_group' && 'pnpm' || '' }}
      - name: Install dependencies
        # build.rs runs the docs generators, which import packages.
        run: pnpm install --frozen-lockfile
      - name: Set up Rust
        # Matches ci.yml; rustup's proxies read the channel in rust-toolchain.toml.
        run: rustup toolchain install stable --profile minimal
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-check-linux
          save-if: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Fetch bundled binaries
        # The Linux bundle's pinned git-ai and starship, which tauri-build needs in place.
        run: bash scripts/fetch-bundled.sh
      - name: Build sidecars
        # The app's build script needs the bundled sidecars to exist.
        run: bash scripts/build-session-server.sh
      - name: Check the desktop app
        run: cargo check --locked -p codesense --lib --tests --features dashboard-publish
      - name: Check the desktop app with git-ai off
        # CODESENSE_CAPS_OFF turns capabilities off for one build, so Linux compiles the code a
        # platform without them builds: their facades' off arms, with the gated parts left out.
        env:
          CODESENSE_CAPS_OFF: git-ai
        run: cargo check --locked -p codesense --lib --tests --features dashboard-publish

  rust-linux-app:
    name: Rust (Linux app)
    # The app crate's Linux-relevant tests, starting with the credential store against a real
    # Secret Service (GNOME Keyring on a private session bus). Not a required check. The tests are
    # `#[ignore]`d everywhere else, so only this job runs them. It widens as more of the app's
    # Linux tests move here. It also runs pty-core's pty contract against the unix pty. Like the
    # macOS and Windows jobs it skips merge groups, and runs on pull requests, main and the nightly
    # run.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' && github.event_name != 'merge_group' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system libraries
        # The shared app list, plus a session bus, the keyring daemon and its CLI, and for PDF
        # export's renderer a virtual display, GTK's German translations and poppler's readers.
        run: >-
          bash scripts/install-linux-app-libs.sh dbus gnome-keyring libsecret-tools
          xvfb xauth language-pack-gnome-de-base language-pack-de poppler-utils
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: ${{ github.event_name != 'merge_group' && 'pnpm' || '' }}
      - name: Install dependencies
        # build.rs runs the docs generators, which import packages.
        run: pnpm install --frozen-lockfile
      - name: Set up Rust
        # Matches ci.yml; rustup's proxies read the channel in rust-toolchain.toml.
        run: rustup toolchain install stable --profile minimal
      - name: Restore scanner archives
        # Archives named by their sha256; install-scanners verifies each against the lock before use.
        id: scanner-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scanner-archives
          key: scanner-archives-nextest-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('release/scanners.lock') }}
      - name: Install pinned nextest
        run: |
          bash scripts/install-scanners.sh "$RUNNER_TEMP/rust-ci-tools" --cache "$RUNNER_TEMP/scanner-archives" --tool cargo-nextest
          echo "$RUNNER_TEMP/rust-ci-tools" >> "$GITHUB_PATH"
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-linux-app
          save-if: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Fetch bundled binaries
        # The Linux bundle's pinned git-ai and starship, which tauri-build needs in place.
        run: bash scripts/fetch-bundled.sh
      - name: Build sidecars
        # The app's build script needs the bundled sidecars to exist.
        run: bash scripts/build-session-server.sh
      - name: Compile the app's tests
        run: cargo nextest run --profile ci --locked -p codesense --lib --no-run
      - name: Test the git-ai pins and the capability table
        # The pure tests of the pin each target installs and of where git-ai and the other
        # capabilities are on, so Linux checks the pin and answer its own target runs with, and
        # the git-ai facade's tests with the capability off.
        run: >-
          cargo nextest run --profile ci --locked -p codesense --lib --retries 0
          -E 'test(/^platform_caps::tests::/) | test(/^attribution::facade::tests::/) | test(/^attribution::install::tests::(every_target_pin_parses_and_names_its_own_platform|every_git_ai_pin_file_has_a_target_and_every_target_a_file|linux_targets_pin_the_cs5_release|a_target_without_a_pin_has_none|the_running_pin_is_the_hosts_or_else_the_macos_one|a_pin_for_another_platform_is_refused|supported_needs_a_pin_and_the_capability)$/)'
      - name: Test the machine values agents read
        # The local machine stays "This Mac" as data off macOS too, while the text a person reads
        # says "This computer".
        run: >-
          cargo nextest run --profile ci --locked -p codesense --lib --retries 0
          -E 'test(/^mcp::(terminal_tabs|identity_tools)::tests::a_local_tab_is_on_this_mac_on_every_os$/) | test(/^commands::machines::tests::the_local_machine_is_labelled_this_mac_on_every_os$/)'
      - name: Diagnose the PDF renderer hang (throwaway)
        run: |
          sudo apt-get install -y --no-install-recommends gdb
          bash scripts/ci/diag-pdf-hang.sh
      - name: Upload the diagnosis logs (throwaway)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf-diag-${{ github.run_id }}
          path: ${{ runner.temp }}/pdf-diag

  rust-check-windows:
    name: Rust check (Windows)
    # A compile check of the crates that build on Windows, the session server's among them with its
    # sidecar gated off, plus the platform crate's tests, Claude's hooks, the session server's
    # portable items, the runner's cursor-query answer, and the pty contract against ConPTY with the
    # Windows emulator worker. Not a required check: like the macOS jobs it never runs on a merge
    # group, runs after the merge on each push to main that changes something Rust can see, always
    # on the nightly schedule and workflow_dispatch, and on a pull request only with the ci:windows
    # label (never a Dependabot pull request, and not again when another label is added). The crate
    # set grows as crates port.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' && github.event_name != 'merge_group' && (github.event_name != 'pull_request' || (github.event.pull_request.user.login != 'dependabot[bot]' && contains(github.event.pull_request.labels.*.name, 'ci:windows') && (github.event.action != 'labeled' || github.event.label.name == 'ci:windows'))) }}
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      CARGO_TERM_COLOR: always
    steps:
      - name: Keep line endings as committed
        # Before checkout, so the checkout keeps LF and tests that read source files see what Linux sees.
        run: git config --global core.autocrlf false
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test sidecar naming in Git Bash
        # The .exe suffix, and paths in Git Bash's /d/a/... form.
        run: bash scripts/lib/sidecar.test.sh
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: ${{ github.event_name != 'merge_group' && 'pnpm' || '' }}
      - name: Install dependencies
        # The emulator worker's build runs tsc and esbuild.
        run: pnpm install --frozen-lockfile
      - name: Set up Rust
        # Matches ci.yml; rustup's proxies read the channel in rust-toolchain.toml.
        run: rustup toolchain install stable --profile minimal
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-windows
          save-if: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Check the Windows crates
        run: cargo check --locked -p codesense-platform -p codesense-host-proto -p codesense-fs-core -p codesense-pty-core -p codesense-session-server --all-targets
      - name: Test the platform crate
        run: cargo test --locked -p codesense-platform
      - name: Test Claude's hooks
        run: "cargo test --locked -p codesense-host-proto --lib hook::"
      - name: Test the session server's portable items
        # What the app reads from the session server on every target; its sidecar is off here. A
        # filter that matches no test passes in libtest, so the step fails unless one ran.
        run: |
          cargo test --locked -p codesense-session-server --lib portable 2>&1 | tee "$RUNNER_TEMP/portable-tests.log"
          grep -Eq '^test result: ok\. [1-9][0-9]* passed' "$RUNNER_TEMP/portable-tests.log"
      - name: Test the cursor-query answer
        # The runner answers a pseudo console's startup cursor query itself. A filter that matches no
        # test passes in libtest, so the step fails unless one ran.
        run: |
          cargo test --locked -p codesense-pty-core --lib runner::cursor_reply:: 2>&1 | tee "$RUNNER_TEMP/cursor-reply-tests.log"
          grep -Eq '^test result: ok\. [1-9][0-9]* passed' "$RUNNER_TEMP/cursor-reply-tests.log"
      - name: Build the emulator worker
        # After Rust: the script takes the host triple from rustc.
        run: pnpm run build:emulator
      - name: Test the pty contract, the tree kill and a session with no viewer
        # ConPTY behind a host running the emulator worker, the Job Object ending a session's tree,
        # and a session's exit reported with no viewer or worker to answer its terminal.
        env:
          CODESENSE_EMULATOR_WORKER: ${{ github.workspace }}/src-tauri/binaries/codesense-emulator-x86_64-pc-windows-msvc.exe
        run: cargo test --locked --no-fail-fast -p codesense-pty-core --test pty_contract --test process_tree --test headless_session

  flaky-issues:
    name: Track flaky Rust tests
    needs: [rust-macos, rust-linux]
    # The only job that writes issues: the nightly run on main in this repository, never pull
    # requests, merge groups or forks. It reads the uploaded JUnit reports; the test jobs stay read-only.
    if: ${{ !cancelled() && github.event_name == 'schedule' && github.ref == 'refs/heads/main' && !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    # One run at a time, so two runs (a nightly and a rerun, say) cannot both open an issue for the
    # same test. GitHub keeps at most one more waiting and cancels an older waiting run, whose
    # flakes then go untracked; a test that keeps flaking is tracked on its next flake.
    concurrency:
      group: flaky-issues
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Download JUnit reports
        # This attempt's reports, one directory per artifact. A job whose tests never built uploaded
        # none, and a pattern that matches nothing downloads nothing.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rust-*-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/junit
      - name: Open or update flaky test issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          node scripts/flaky-tests.mjs track "$RUNNER_TEMP/junit"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
