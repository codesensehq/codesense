# SPDX-License-Identifier: MIT
name: Rust tests

on:
  pull_request:
    # The defaults, plus labeled: adding ci:macos starts the macOS job (below) on the pull request.
    types: [opened, synchronize, reopened, labeled]
  merge_group:
  # The macOS job skips merge groups, so it runs on each push to main instead, after the merge.
  # The nightly run on main saves the caches and tracks flaky tests.
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  # A label other than ci:macos gets a group of its own, so it never cancels the pull request's run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}${{ github.event.action == 'labeled' && github.event.label.name != 'ci:macos' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  # No debuginfo (the test profile inherits dev): compiles and links faster. Panic messages
  # keep file:line, which comes from the panic location; only backtrace frames lose line numbers.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  changes:
    name: Rust changes
    # A merge group or pull request that changes nothing the Rust jobs build, run or read skips
    # them. GitHub reports a job skipped by its if as a success, so the required checks still
    # pass (a workflow skipped by a paths filter would leave them pending). The Rust jobs run
    # unless this job says rust=false, so its failure runs them too. A push to main diffs what it
    # added (a new branch tip has no before, so it tests); scheduled and manual runs always test.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history without file contents: enough to diff a pull request or merge group.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Find Rust-relevant changes
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            merge_group) range="$GROUP_BASE..$GROUP_HEAD" ;;
            push)
              if [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then echo "rust=true" >> "$GITHUB_OUTPUT"; exit 0; fi
              range="$PUSH_BEFORE..$PUSH_AFTER" ;;
            *) echo "rust=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          # The filter never judges a change to itself.
          if git diff --name-only "$range" | grep -qE '^(scripts/rust-changes[^/]*|\.github/workflows/rust\.yml)$'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/rust-changes.mjs "$range" >> "$GITHUB_OUTPUT"

  rust-guards:
    name: Rust guards
    # The source guards also scan the frontend (src/), so they run on every change, path filter or
    # not. They need no Tauri build: a small crate whose tests read source files.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        # Matches ci.yml; rustup's proxies read the channel in rust-toolchain.toml.
        run: rustup toolchain install stable --profile minimal
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-guards
          save-if: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Test source guards
        run: cargo test --locked -p codesense-guards

  rust-macos:
    name: Rust (macOS arm64)
    # macOS runners are scarce, and this job is not a required check: it never runs on a merge
    # group, so the queue merges on the Linux and TypeScript checks. It runs after the merge, on
    # each push to main that changes something Rust can see (the changes job), and always on the
    # nightly schedule and workflow_dispatch; a red run there goes to the next hardening pass. On a
    # pull request it runs only with the ci:macos label, never on a Dependabot pull request, and
    # not again when another label is added. workflow-policy allows only this job to skip merge
    # groups, and keeps the github.event_name != 'pull_request' || so push and schedule run it.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' && github.event_name != 'merge_group' && (github.event_name != 'pull_request' || (github.event.pull_request.user.login != 'dependabot[bot]' && contains(github.event.pull_request.labels.*.name, 'ci:macos') && (github.event.action != 'labeled' || github.event.label.name == 'ci:macos'))) }}
    runs-on: macos-15
    # Room for a full compile of the set, most of which the dependency cache does not
    # cover, followed by tests and doctests.
    timeout-minutes: 150
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      CARGO_TERM_COLOR: always
      RUST_PACKAGES: -p codesense-guards -p codesense -p codesense-host-proto -p codesense-pty-core -p codesense-fs-core -p codesense-session-server
    steps:
      # All paths below are relative to this repository's checkout.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure Git identity
        run: |
          git config --global user.name "CodeSense CI"
          git config --global user.email "security@codesense.ai"
      - name: Prepare logs
        run: mkdir -p "$RUNNER_TEMP/rust-ci-logs"
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: ${{ github.event_name != 'merge_group' && 'pnpm' || '' }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/rust-ci-logs/pnpm-install.log"
      - name: Set up Rust
        # Matches ci.yml; rustup's proxies read the channel in rust-toolchain.toml.
        run: rustup toolchain install stable --profile minimal 2>&1 | tee "$RUNNER_TEMP/rust-ci-logs/rustup.log"
      - name: Restore scanner archives
        # Archives named by their sha256; install-scanners verifies each against the lock before use.
        id: scanner-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scanner-archives
          key: scanner-archives-nextest-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('release/scanners.lock') }}
      - name: Install pinned nextest
        run: |
          bash scripts/install-scanners.sh "$RUNNER_TEMP/rust-ci-tools" --cache "$RUNNER_TEMP/scanner-archives" --tool cargo-nextest
          echo "$RUNNER_TEMP/rust-ci-tools" >> "$GITHUB_PATH"
      - name: Save scanner archives
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && steps.scanner-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scanner-archives
          key: ${{ steps.scanner-cache.outputs.cache-primary-key }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-macos
          save-if: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Fetch git-ai
        run: bash scripts/fetch-git-ai.sh 2>&1 | tee "$RUNNER_TEMP/rust-ci-logs/fetch-git-ai.log"
      - name: Build session-server sidecar
        # This also builds the bridge sidecar, so a separate bridge build is unnecessary.
        # Native host only: build-emulator.sh fetches checksum-pinned Bun itself.
        # Docker is only used for uninstalled cross targets, which are not requested.
        run: bash scripts/build-session-server.sh 2>&1 | tee "$RUNNER_TEMP/rust-ci-logs/build-session-server.log"
      - name: Compile macOS tests
        id: compile
        run: |
          read -r -a packages <<< "$RUST_PACKAGES"
          cargo nextest run --profile ci "${packages[@]}" --no-run \
          2>&1 | tee "$RUNNER_TEMP/rust-ci-logs/cargo-compile.log"
      - name: Test macOS crates
        # Exercise macOS cfg tests in the host crates as well as the desktop app.
        run: |
          read -r -a packages <<< "$RUST_PACKAGES"
          cargo nextest run --profile ci "${packages[@]}" \
          2>&1 | tee "$RUNNER_TEMP/rust-ci-logs/cargo-test.log"
      - name: List flaky tests
        # A pass on nextest's one retry is flaky: listed in the job summary and the JUnit report,
        # and tracked as a public issue by flaky-issues on main.
        if: (success() || failure()) && steps.compile.outcome == 'success'
        run: node scripts/flaky-tests.mjs summary target/nextest/ci/junit.xml
      - name: Test macOS doctests
        timeout-minutes: 15
        # Runs after failed tests, but not when the test build never ran; on macOS the build script
        # then fails on sidecars an earlier failed step never built, hiding the real failure.
        if: (success() || failure()) && steps.compile.outcome == 'success'
        run: |
          read -r -a packages <<< "$RUST_PACKAGES"
          cargo test --doc "${packages[@]}" --no-fail-fast \
          2>&1 | tee "$RUNNER_TEMP/rust-ci-logs/cargo-doctest.log"
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-macos-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: warn
      - name: Check tracked files are unchanged
        if: success() || failure()
        run: git diff --exit-code 2>&1 | tee "$RUNNER_TEMP/rust-ci-logs/tracked-files.log"
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-macos-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-ci-logs/
          retention-days: 7
          if-no-files-found: warn
      - name: Summarize a red run on main
        # Nothing blocks on this job, so a red run on main says what failed in the job summary for
        # the hardening pass: the run link and each failed test. Read-only: no issue is written.
        # Last, so a red tracked-files check or a timeout (cancelled) still gets a summary.
        if: (failure() || cancelled()) && github.ref == 'refs/heads/main'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/flaky-tests.mjs failed target/nextest/ci/junit.xml --run-url "$RUN_URL"

  rust-linux:
    name: Rust (Linux)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      CARGO_TERM_COLOR: always
      # Only the crates that pass on Linux today; macOS also runs pty-core,
      # session-server, guards and the desktop app.
      RUST_PACKAGES: -p codesense-host-proto -p codesense-fs-core
    steps:
      # All paths below are relative to this repository's checkout.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure Git identity
        run: |
          git config --global user.name "CodeSense CI"
          git config --global user.email "security@codesense.ai"
      - name: Prepare logs
        run: mkdir -p "$RUNNER_TEMP/rust-ci-logs"
      - name: Set up Rust
        # Matches ci.yml; rustup's proxies read the channel in rust-toolchain.toml.
        run: rustup toolchain install stable --profile minimal 2>&1 | tee "$RUNNER_TEMP/rust-ci-logs/rustup.log"
      - name: Restore scanner archives
        # Archives named by their sha256; install-scanners verifies each against the lock before use.
        id: scanner-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scanner-archives
          key: scanner-archives-nextest-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('release/scanners.lock') }}
      - name: Install pinned nextest
        run: |
          bash scripts/install-scanners.sh "$RUNNER_TEMP/rust-ci-tools" --cache "$RUNNER_TEMP/scanner-archives" --tool cargo-nextest
          echo "$RUNNER_TEMP/rust-ci-tools" >> "$GITHUB_PATH"
      - name: Save scanner archives
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && steps.scanner-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scanner-archives
          key: ${{ steps.scanner-cache.outputs.cache-primary-key }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-linux
          save-if: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Compile Linux tests
        id: compile
        run: |
          read -r -a packages <<< "$RUST_PACKAGES"
          cargo nextest run --profile ci "${packages[@]}" --no-run \
          2>&1 | tee "$RUNNER_TEMP/rust-ci-logs/cargo-compile.log"
      - name: Test Linux crates
        run: |
          read -r -a packages <<< "$RUST_PACKAGES"
          cargo nextest run --profile ci "${packages[@]}" \
          2>&1 | tee "$RUNNER_TEMP/rust-ci-logs/cargo-test.log"
      - name: List flaky tests
        # A pass on nextest's one retry is flaky: listed in the job summary and the JUnit report,
        # and tracked as a public issue by flaky-issues on main.
        if: (success() || failure()) && steps.compile.outcome == 'success'
        run: node scripts/flaky-tests.mjs summary target/nextest/ci/junit.xml
      - name: Test Linux doctests
        timeout-minutes: 15
        # Runs after failed tests, but not when the test build never ran, so an earlier failure
        # is reported as itself.
        if: (success() || failure()) && steps.compile.outcome == 'success'
        run: |
          read -r -a packages <<< "$RUST_PACKAGES"
          cargo test --doc "${packages[@]}" --no-fail-fast \
          2>&1 | tee "$RUNNER_TEMP/rust-ci-logs/cargo-doctest.log"
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-linux-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: warn
      - name: Check tracked files are unchanged
        if: success() || failure()
        run: git diff --exit-code 2>&1 | tee "$RUNNER_TEMP/rust-ci-logs/tracked-files.log"
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-linux-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-ci-logs/
          retention-days: 7
          if-no-files-found: warn

  rust-check-linux:
    name: Rust check (Linux)
    # A compile check of the desktop app and its tests on pull requests, merge groups, main and the
    # nightly run: the only compile of the app before a merge. Check only: the tests themselves run
    # on macOS, after the merge. It also builds the release-only `dashboard-publish` feature, which
    # no other public job compiles.
    # Gap: code behind `cfg(target_os = "macos")` and the macOS-only dependencies is not compiled
    # on Linux. A change to that code first compiles on main, after the merge; add the `ci:macos`
    # label to the pull request to run the macOS job before the queue.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system libraries
        # What the Tauri app links against on Linux: WebKitGTK, the tray indicator, SVG icons,
        # D-Bus for the keyring, xdo for input, and OpenSSL.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libxdo-dev libssl-dev
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: ${{ github.event_name != 'merge_group' && 'pnpm' || '' }}
      - name: Install dependencies
        # build.rs runs the docs generators, which import packages.
        run: pnpm install --frozen-lockfile
      - name: Set up Rust
        # Matches ci.yml; rustup's proxies read the channel in rust-toolchain.toml.
        run: rustup toolchain install stable --profile minimal
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-check-linux
          save-if: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Fetch git-ai
        run: bash scripts/fetch-git-ai.sh
      - name: Build sidecars
        # The app's build script needs the bundled sidecars to exist.
        run: bash scripts/build-session-server.sh
      - name: Check the desktop app
        run: cargo check --locked -p codesense --lib --tests --features dashboard-publish

  flaky-issues:
    name: Track flaky Rust tests
    needs: [rust-macos, rust-linux]
    # The only job that writes issues: the nightly run on main in this repository, never pull
    # requests, merge groups or forks. It reads the uploaded JUnit reports; the test jobs stay read-only.
    if: ${{ !cancelled() && github.event_name == 'schedule' && github.ref == 'refs/heads/main' && !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    # One run at a time, so two runs (a nightly and a rerun, say) cannot both open an issue for the
    # same test. GitHub keeps at most one more waiting and cancels an older waiting run, whose
    # flakes then go untracked; a test that keeps flaking is tracked on its next flake.
    concurrency:
      group: flaky-issues
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Download JUnit reports
        # This attempt's reports, one directory per artifact. A job whose tests never built uploaded
        # none, and a pattern that matches nothing downloads nothing.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: rust-*-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/junit
      - name: Open or update flaky test issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          node scripts/flaky-tests.mjs track "$RUNNER_TEMP/junit"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
