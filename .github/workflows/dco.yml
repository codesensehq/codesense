# SPDX-License-Identifier: MIT
name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # merge groups: who opened each queued pull request
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: tree:0
      - name: Check every commit is signed off
        env:
          DCO_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          DCO_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          DCO_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          DCO_EVENT: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/dco-check.mjs
