[package]
name = "codesense-guards"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
# `span-locations`: the X1 guard prints the line of each call it cannot resolve.
proc-macro2 = { version = "1", features = ["span-locations"] }
# The tiles flag-sites guard reads `src/shared/lib/tiles-flag-sites.json`.
serde_json = "1"
# The retired-names and inheritance guards, moved from the app crate, match and walk with these.
regex = "1"
walkdir = "2"
