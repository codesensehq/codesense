pack_format: 1
id: codesense-guide
name: CodeSense setup
version: 0.1.0
publisher: codesense
summary: The setup agent that opens on first launch and does the setup with you, one consent card at a time.
license: MIT
requires:
  clis:
    - { name: claude, optional: true }
    - { name: codex, optional: true }
    - { name: opencode, optional: true }
parts:
  - { id: guide, kind: preset, includes: [ guide-claude, guide-codex, guide-opencode, guide-content, codesense-setup ], default: true }
  - { id: guide-claude, kind: agent, file: agents/guide-claude/agent.yaml, needs: [ guide-content, codesense-setup ] }
  - { id: guide-codex, kind: agent, file: agents/guide-codex/agent.yaml, needs: [ guide-content, codesense-setup ] }
  - { id: guide-opencode, kind: agent, file: agents/guide-opencode/agent.yaml, needs: [ guide-content, codesense-setup ] }
  - { id: guide-content, kind: content, title: Guide, paths: [ "content/guide/**" ] }
  - id: codesense-setup
    kind: skill
    source: commands/codesense-setup.md
    targets: [ claude, codex, opencode ]
