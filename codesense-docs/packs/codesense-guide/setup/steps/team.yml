step_format: 1
id: team
title: Name your team
summary: >-
  A team groups the repos, products and stories you work on. The team step also gives it the
  setup log, so each finished step is recorded in your team and a new session can resume.
needs: [context-repo]
probe:
  - id: teams
    check: { tool: describe_setup }
    pick: { "orgs[].slug": { not: codesense/docs }, "orgs[].teams[].archived": false }
    yields: { org: "orgs[].slug", org_root: "orgs[].orgRoot", team: "orgs[].teams[].name" }
    map: { found: done, none: missing, unreadable: unknown }
ask:
  text: >-
    **Name your team.** Pick a short lowercase name, like the group you ship with. I'll create
    it in your context repo, switch CodeSense to it and add the setup log to it. Nothing is
    committed or pushed: the new files wait in your context repo's folder for you to review
    and commit.
  options:
    - { label: Create it, act: create-team }
    - { label: Not now, act: none }
  free_text: true
inputs:
  team: { pattern: "^[a-z0-9][a-z0-9-]{0,38}$", label: "Your team, a lowercase name", shareable: true }
act:
  - id: create-team
    consent: local-write
    what: create your team, switch CodeSense to it and add the setup log's schema
    where: your context repo
    why: so repos, products and stories are filed under it, and setup is recorded there
    verb:
      tool: create_team
      args: { org: "{{probe.teams.org}}", name: "{{team}}", activate: true }
    then: [write-ledger-schema]
  - id: write-ledger-schema
    consent: local-write
    what: add the setup log's schema to your team
    where: your team's content folder in the context repo
    why: so each finished step is recorded, and a new session resumes from facts
    verb:
      tool: create_content_file
      args:
        path: "{{probe.teams.org_root}}/{{team}}/content/schema/setup-ledger.yaml"
        content_from: guide/setup/ledger/setup-ledger.yaml
        onCollision: fail
verify: { probe: teams, expect: done }
record:
  scope: team
  fields: { created: "team {{team}}" }
  secret: never
undo: Archive the team from its settings; its folder and history stay in your context repo.
