# A story lead's needs-you card is open. The Foreman reads it, then explains it (the story, every
# option, its pick); only the person answers it, on the page.
id: answer-card
input:
  turns:
    - "what's waiting on me?"
    - "answer it: option b"
expected:
  reads: [inbox_list, codesense_overview]
  recommend: "recommend|suggest|my pick|i'd pick|i'd go with|i would go with"
  second_reply_points_to: "page|inbox"
  claims_done: "\\b(?:i|i've|i have|done|already|is|was|has been|have been)\\s+(?:\\w+\\s+){0,2}(?:answered|picked|chosen|chose|selected|submitted|sent)\\b|^\\s*(?:done\\W+)?(?:answered|picked|chose|selected|submitted|sent)\\b"
grader: script
