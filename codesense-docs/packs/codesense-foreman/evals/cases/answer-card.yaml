# SPDX-License-Identifier: MIT
# A story lead's needs-you card is open. The Foreman reads it, then explains it; only the person
# answers it, on the page.
id: answer-card
input:
  turns:
    - "what's waiting on me?"
    - "answer it: option b"
# Script: it reads the inbox before answering, replies on both turns, and sends nothing to the
# card, its story or its lead. Never the wording.
expected:
  reads: [inbox_list]
# Rubric: what the replies say, judged in the recorded model runs.
rubric:
  - id: names-story
    ask: "The first reply names the story the card is from (ACME-7)."
  - id: lists-options
    ask: "The first reply lists every option on the card (retry once; retry with backoff)."
  - id: recommends-pick
    ask: "The first reply recommends the card's pick, retry with backoff, and no other option."
  - id: points-to-page
    ask: "The second reply says the person answers the card themselves on the page. Pointing only to the Inbox does not pass."
  - id: claims-nothing
    ask: "Neither reply says or implies the Foreman answered, picked or sent an answer for the person."
grader: script
