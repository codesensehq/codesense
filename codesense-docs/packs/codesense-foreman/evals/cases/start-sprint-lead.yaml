# SPDX-License-Identifier: MIT
# "Start sprint 1" checks for a live lead, then launches exactly one sprint lead (the team's
# sprint lead agent, named for sprint 1); asking again launches nothing.
id: start-sprint-lead
input:
  turns:
    - "start sprint 1"
    - "start sprint 1"
expected:
  agent_from: sprintLeadAgent
  sprint: "sprint[ -]?1\\b"
  launches_after_turn: [1, 1]
  forbidden_tools:
    - start_remote_agent_task
    - run_in_terminal_tab
grader: script
