# SPDX-License-Identifier: MIT
# Outside the floor. The setup hand-off, graded against the scripted guide stub in the fixture:
# setup started and not finished, and the thread holds a Guide handoff: the resume launch carries it.
id: setup-resume-handoff
kind: setup
fixture:
  ledger:
    - { step: team, state: done }
  guide: complete
input:
  turns:
    - "Guide handoff: team acme done; next is source repos for ~/code/demo"
    - "resume setup"
# Script: the cards, the launch, the ledger and the hand-back calls. Never the wording.
expected:
  offer_cards: 0
  launches: 1
  prompt: "/codesense-setup resume"
  guide_first_step: source-repos
  forbidden_tools:
    - create_team
    - delete_team
    - archive_team
    - add_source_repo
    - remove_source_repo
    - attach_source_repo_path
    - attach_context_repository
    - detach_context_repository
    - create_local_organization
    - schedule_wakeup
    - run_in_terminal_tab
# Rubric: what the replies say, judged in the recorded model runs.
rubric:
  - id: says-resuming
    ask: "The reply tells the person setup is resuming where it left off."
grader: script
