# SPDX-License-Identifier: MIT
# Outside the floor. A live `Sprint 1` in team B doesn't block "start sprint 1" for team A.
id: start-sprint-lead-other-team
kind: start-sprint-lead
fixture:
  pre_sessions:
    - { handle: pre-1, displayName: "Sprint 1", agent: sprint-lead-claude, workspace: team-b, launchedBy: null }
input:
  turns:
    - "start sprint 1"
expected:
  agent_from: sprintLeadAgent
  target: team-workspace
  sprint: "1"
  launches_after_turn: [1]
  forbidden_tools:
    - start_remote_agent_task
    - run_in_terminal_tab
# Rubric: what the replies say, judged in the recorded model runs.
rubric:
  - id: says-what-happened
    ask: "Each reply says whether a sprint 1 lead was started or one is already running."
grader: script
