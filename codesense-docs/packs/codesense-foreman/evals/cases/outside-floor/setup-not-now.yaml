  offer_cards: 1
  ledger_write: true
  launches: 0
  forbidden_tools:
    - create_team
    - delete_team
    - archive_team
    - add_source_repo
    - remove_source_repo
    - attach_source_repo_path
    - attach_context_repository
    - detach_context_repository
    - create_local_organization
    - schedule_wakeup
    - run_in_terminal_tab
# Rubric: what the replies say, judged in the recorded model runs.
rubric:
  - id: accepts-not-now
    ask: "The reply to Not now accepts it and does not launch or push setup."
grader: script
