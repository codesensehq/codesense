# SPDX-License-Identifier: MIT
# Request to story, outside the floor. The team recorded `gh` as its git-access method: the Foreman opens the pull request with it.
id: new-story-git-access-gh
kind: new-story
fixture:
  story_team: generic
  git_access: gh
input:
  turns:
    - "make a story for dark mode in the settings page"
    - "Create"
# Script: the recorded method read before any pull request; one pull request from the pushed story branch, made with gh.
expected:
  forbidden_tools:
    - schedule_wakeup
    - run_in_terminal_tab
# Rubric: what the replies say, judged in the recorded model runs.
rubric:
  - id: one-card
    ask: "The request gets one confirmation with the choices Create, Change and Not now."
  - id: says-pr
    ask: "After Create, the reply says a pull request was opened and names its branch."
grader: script
