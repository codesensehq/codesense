# Request to story, outside the floor. The team recorded a GitHub MCP server as its git-access method: the Foreman opens the pull request with its PR tool, and never calls gh.
id: new-story-git-access-github-mcp
kind: new-story
fixture:
  story_team: generic
  git_access: github-mcp
input:
  turns:
    - "make a story for dark mode in the settings page"
    - "Create"
# Script: the recorded method read before any pull request; one pull request from the pushed story branch, made with the GitHub MCP tool, and zero gh calls.
expected:
  forbidden_tools:
    - schedule_wakeup
    - run_in_terminal_tab
# Rubric: what the replies say, judged in the recorded model runs.
rubric:
  - id: one-card
    ask: "The request gets one confirmation with the choices Create, Change and Not now."
  - id: says-pr
    ask: "After Create, the reply says a pull request was opened and names its branch."
grader: script
