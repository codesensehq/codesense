# SPDX-License-Identifier: MIT
# Outside the floor. The setup hand-off, graded against the scripted guide stub in the fixture:
# a guide session the person started by hand is not the Foreman's: it launches its own.
id: setup-reuse-by-hand
kind: setup
fixture:
  pre_sessions:
    - { agent: guide-claude, displayName: My setup, workspace: acme }
  guide: complete
input:
  turns:
    - "set me up with ~/code/demo"
# Script: the cards, the launch, the ledger and the hand-back calls. Never the wording.
expected:
  offer_cards: 0
  launches: 1
  prompt: "/codesense-setup"
  forbidden_tools:
    - create_team
    - delete_team
    - archive_team
    - add_source_repo
    - remove_source_repo
    - attach_source_repo_path
    - attach_context_repository
    - detach_context_repository
    - create_local_organization
    - schedule_wakeup
    - run_in_terminal_tab
# Rubric: what the replies say, judged in the recorded model runs.
rubric:
  - id: says-setup-started
    ask: "The reply says a setup session started."
grader: script
