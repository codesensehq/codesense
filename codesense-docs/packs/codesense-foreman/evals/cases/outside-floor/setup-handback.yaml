# SPDX-License-Identifier: MIT
# Outside the floor. The setup hand-off, graded against the scripted guide stub in the fixture:
# with no user team, "set me up" is the yes: no offer card. The guide stub finishes and sends Setup done: to role:codesense-foreman; the Foreman claims, acks and says one Set up: line.
id: setup-handback
kind: setup
fixture:
  story_team: docs
  guide: complete
input:
  turns:
    - "set me up with ~/code/demo"
# Script: the cards, the launch, the ledger and the hand-back calls. Never the wording.
expected:
  offer_cards: 0
  launches: 1
  prompt: "/codesense-setup"
  guide_first_step: team
  hand_back: claimed
  forbidden_tools:
    - create_team
    - delete_team
    - archive_team
    - add_source_repo
    - remove_source_repo
    - attach_source_repo_path
    - attach_context_repository
    - detach_context_repository
    - create_local_organization
    - schedule_wakeup
    - run_in_terminal_tab
# Rubric: what the replies say, judged in the recorded model runs.
rubric:
  - id: set-up-line
    ask: "After the hand-back the Foreman says one line starting Set up: that summarises what the ledger shows (team, repos, gh)."
grader: script
