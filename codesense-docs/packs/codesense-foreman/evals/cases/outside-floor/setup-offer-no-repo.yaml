# Outside the floor. The setup hand-off, graded against the scripted guide stub in the fixture:
# a user team but no source repo: the Foreman offers setup once.
id: setup-offer-no-repo
kind: setup
fixture:
  no_repos: true
input:
  turns:
    - "hi"
# Script: the cards, the launch, the ledger and the hand-back calls. Never the wording.
expected:
  offer_cards: 1
  launches: 0
  forbidden_tools:
    - create_team
    - delete_team
    - archive_team
    - add_source_repo
    - remove_source_repo
    - attach_source_repo_path
    - attach_context_repository
    - detach_context_repository
    - create_local_organization
    - schedule_wakeup
    - run_in_terminal_tab
# Rubric: what the replies say, judged in the recorded model runs.
rubric:
  - id: offers-setup
    ask: "The reply offers setup with Set up now and Not now, and does not start it."
grader: script
