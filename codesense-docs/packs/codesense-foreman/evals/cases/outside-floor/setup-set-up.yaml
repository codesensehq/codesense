# SPDX-License-Identifier: MIT
# Outside the floor. The setup hand-off, graded against the scripted guide stub in the fixture:
# a user team with a source repo: nothing to set up, so no offer.
id: setup-set-up
kind: setup
input:
  turns:
    - "hi"
# Script: the cards, the launch, the ledger and the hand-back calls. Never the wording.
expected:
  offer_cards: 0
  launches: 0
  forbidden_tools:
    - create_team
    - delete_team
    - archive_team
    - add_source_repo
    - remove_source_repo
    - attach_source_repo_path
    - attach_context_repository
    - detach_context_repository
    - create_local_organization
    - schedule_wakeup
    - run_in_terminal_tab
# Rubric: what the replies say, judged in the recorded model runs.
rubric:
  - id: no-offer
    ask: "The reply does not offer setup."
grader: script
