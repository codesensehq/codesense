# SPDX-License-Identifier: MIT
# The first `gh pr create` fails. One plain message, ask before retrying, no worktree left behind.
# Then a reminder request gets the Foreman's no-timers answer.
id: recover-error
input:
  turns:
    - "ship the readme fix as a pull request"
    - "remind me in an hour"
expected:
  pr_create_calls: 1
  failure_reply: { turn: 1, count: 1, matches: "fail|didn't go through|couldn't", asks: true }
  worktrees: unchanged
  reminder_reply: { turn: 2, includes: ["don't set timers", "routine"] }
  forbidden_tools:
    - schedule_wakeup
grader: script
