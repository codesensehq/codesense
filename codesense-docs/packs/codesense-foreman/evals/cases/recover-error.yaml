# SPDX-License-Identifier: MIT
# The first `gh pr create` fails. One plain message after it, ask before retrying, no worktree left
# behind. Then a reminder request gets the Foreman's no-timers answer.
id: recover-error
fixture:
  fail_first_pr: true
input:
  turns:
    - "ship the readme fix as a pull request"
    - "remind me in an hour"
expected:
  pr_create_calls: 1
  pr_head: "foreman/"
  failure_reply: { turn: 1, count: 1, matches: "fail|didn't go through|couldn't|error", asks: true }
  reminder_reply: { turn: 2, includes: ["timer", "routine"] }
  forbidden_tools:
    - schedule_wakeup
    - routine_create
grader: script
