# SPDX-License-Identifier: MIT
# Public config for the bundled Foreman page. It names only product ids: the Foreman and its setup guide.
# Every other key is the kit's neutral default; the kit's other pages are not shipped with the app.
template: 1
team: getting-started
lead:
  agent: story-lead
  role: lead
  queue: story-lead
sprint:
  agent: sprint-lead
  role: sprint-lead
  queue: sprint-lead
  launch: /sprint-lead
foreman:
  role: codesense-foreman
  runtime: claude
  # The docs team's key, the only Foreman the launch grant allows.
  agents:
    - codesense/docs/getting-started/foreman-claude
  guides:
    - guide-claude
  name: Foreman
  worktree: foreman
  docs:
    org: codesense/docs
    team: getting-started
  senders: 20
  history: 5
  # The lease's settle window and expiry, the wait for a handoff, the wait for the old Foreman
  # to exit, and the retry after a busy answer (ms).
  lifecycle:
    settleMs: 1000
    leaseMs: 120000
    handoffMs: 60000
    stopMs: 15000
    busyRetryMs: 2000
  # The agent's own model and the one the cheaper switch launches with; spendSessions is the
  # most sessions today's spend reads.
  models:
    default: claude-opus-5-5
    cheaper: claude-sonnet-5-5
  spendSessions: 10
storyTypes:
  - story
  - bug
  - spike
variants:
  lead: story
  sprint-lead: sprint
  codesense-foreman: foreman
owners:
  pause: null
  transcript: null
  detail: null
phases:
  todo: todo
  in-progress: in-progress
  review: review
  qa: qa
  done: done
rail:
  - todo
  - in-progress
  - review
  - qa
  - done
timers:
  slowMs: 20000
  failMs: 120000
  debounceMs: 500
  noReplyMs: 120000
limits:
  needsYou: 200
  answers: 500
panel:
  tabs: null
# The copy for the blocks the Foreman page mounts: title and empty for each, and the words its
# blocks read. `scripts/foreman-page.mjs --check` fails when the kit reads one this lacks.
blocks:
  identity:
    title: Identity
    empty: No agent session on this page
    viewLabel: View
    story: Story
    auto: Automatic ({label})
    pinned: "{label} · pinned"
    pickerHint: Your page for {name}, wherever {name} opens
    onePage: "Page: {label}"
    showing: Showing {label}
    saveFailed: Not saved · showing {label}
    retry: Try again
    sprintName: Sprint {n} lead
    record:
      file: "{n} file"
      files: "{n} files"
      sprint: Sprint {n}
    roles:
      codesense-foreman: Foreman
      sprint-lead: Sprint lead
      lead: Story lead
      reviewer: Reviewer
      dev: Developer
    states:
      running: running
      idle: waiting for you
      needs-you: needs you in its terminal
      exited: not running
      starting: starting…
      failed: couldn't start
      unknown: status unknown
  chat:
    title: Chat
    empty: No messages yet.
    unavailable: This page has no chat for its agent.
  foreman-head:
    title: The Foreman's model and spend
    empty: Nothing to show yet.
    unavailable: this page has no Foreman for its model and spend
  foreman-welcome:
    title: Welcome
    empty: Nothing to show yet.
    noSession: this page is not the Foreman's
    noChat: this page has no chat for the welcome to sit above
  foreman-panel:
    title: Foreman panel
    empty: Nothing to show here yet.
    unavailable: The Foreman panel needs the Foreman page.
    tablist: Foreman panel
    counts:
      working: "{n} working"
      idle: "{n} idle"
      needsOne: "{n} needs you"
      needsN: "{n} need you"
      none: None running
    views:
