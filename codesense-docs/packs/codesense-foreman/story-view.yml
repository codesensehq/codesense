        empty: Nothing is waiting on you.
        noneRecent: Nothing new in the last 14 days.
        loading: Reading what waits on you…
        failed: Couldn't read what waits on you{reason}
        retry: Try again
        reply: Reply
        send: Send
        replyName: Reply about {name}
        sendFailed: Couldn't send your reply{reason}
        merge: Merge
        open: Open
        openName: Open {name}
        openFailed: Couldn't open that{reason}
