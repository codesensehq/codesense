# The models the Foreman runs on. One agent, one launch argument: the page passes `model`.
agent: foreman-claude
models:
  - { model: claude-opus-5-5, default: true }
  - { model: claude-sonnet-5-5, setting: cheaper }
# One row per agent x model x spec_hash. `eval` is untested until complete k>=3 reports set it
# (see evals/lib/floor.mjs); `report` and `at` name the report that decides it.
# evals/check-registry.mjs recomputes all three from the reports.
variants:
  - { runtime: claude, model: claude-opus-5-5, spec_hash: null, eval: untested, report: null, at: null }
  - { runtime: claude, model: claude-sonnet-5-5, spec_hash: null, eval: untested, report: null, at: null }
