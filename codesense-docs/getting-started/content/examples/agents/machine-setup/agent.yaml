id: machine-setup
name: Machine setup
description: Gets a remote machine ready for CodeSense and adds teammates to it.
runtime: claude
launch: foreground
startup:
  - CLAUDE.md
  - .claude/skills/setup-machine/
  - .claude/skills/add-machine-user/
default_prompt: /setup-machine
# The bridge tools /setup-machine and /add-machine-user call. A Claude agent with a list is denied the rest.
mcp:
  bridge_tools:
    - list_machines
    - save_machine
    - test_machine_connection
    - read_messages
    - reply
    - signal_done
revision: 2
